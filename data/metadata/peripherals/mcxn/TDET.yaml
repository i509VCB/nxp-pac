block/Tdet:
  description: TDET.
  items:
  - name: cr
    description: Control.
    byte_offset: 16
    fieldset: Cr
  - name: sr
    description: Status.
    byte_offset: 20
    fieldset: Sr
  - name: lr
    description: Lock.
    byte_offset: 24
    fieldset: Lr
  - name: ier
    description: Interrupt Enable.
    byte_offset: 28
    fieldset: Ier
  - name: tsr
    description: Tamper Seconds.
    byte_offset: 32
    fieldset: Tsr
  - name: ter
    description: Tamper Enable.
    byte_offset: 36
    fieldset: Ter
  - name: pdr
    description: Pin Direction.
    byte_offset: 40
    fieldset: Pdr
  - name: ppr
    description: Pin Polarity.
    byte_offset: 44
    fieldset: Ppr
  - name: atr
    description: Active Tamper.
    array:
      len: 2
      stride: 4
    byte_offset: 48
    fieldset: Atr
  - name: pgfr
    description: Pin Glitch Filter.
    array:
      len: 8
      stride: 4
    byte_offset: 64
    fieldset: Pgfr
fieldset/Atr:
  description: Active Tamper.
  fields:
  - name: atsr
    description: Active Tamper Shift Register.
    bit_offset: 0
    bit_size: 16
  - name: atp
    description: Active Tamper Polynomial.
    bit_offset: 16
    bit_size: 16
fieldset/Cr:
  description: Control.
  fields:
  - name: swr
    description: Software Reset.
    bit_offset: 0
    bit_size: 1
    enum: Swr
  - name: den
    description: Digital Tamper Enable.
    bit_offset: 1
    bit_size: 1
  - name: tfsr
    description: Tamper Force System Reset.
    bit_offset: 2
    bit_size: 1
  - name: um
    description: Update Mode.
    bit_offset: 3
    bit_size: 1
    enum: Um
  - name: atcs0
    description: Active Tamper Clock Source.
    bit_offset: 4
    bit_size: 1
    enum: Atcs0
  - name: atcs1
    description: Active Tamper Clock Source.
    bit_offset: 5
    bit_size: 1
    enum: Atcs1
  - name: distam
    description: Disable Prescaler On Tamper.
    bit_offset: 8
    bit_size: 1
    enum: Distam
  - name: dpr
    description: Digital Tamper Prescaler.
    bit_offset: 17
    bit_size: 15
fieldset/Ier:
  description: Interrupt Enable.
  fields:
  - name: dtie
    description: Digital Tamper Interrupt Enable.
    bit_offset: 0
    bit_size: 1
  - name: tiie
    description: Tamper Input n Interrupt Enable.
    bit_offset: 2
    bit_size: 1
    array:
      len: 10
      stride: 1
  - name: tpie
    description: Tamper Pin n Interrupt Enable.
    bit_offset: 16
    bit_size: 1
    array:
      len: 8
      stride: 1
fieldset/Lr:
  description: Lock.
  fields:
  - name: crl
    description: Control Register Lock.
    bit_offset: 4
    bit_size: 1
    enum: Crl
  - name: srl
    description: Status Register Lock.
    bit_offset: 5
    bit_size: 1
    enum: Srl
  - name: lrl
    description: Lock Register Lock.
    bit_offset: 6
    bit_size: 1
    enum: Lrl
  - name: iel
    description: Interrupt Enable Lock.
    bit_offset: 7
    bit_size: 1
    enum: Iel
  - name: tsl
    description: Tamper Seconds Lock.
    bit_offset: 8
    bit_size: 1
    enum: Tsl
  - name: tel
    description: Tamper Enable Lock.
    bit_offset: 9
    bit_size: 1
    enum: Tel
  - name: pdl
    description: Pin Direction Lock.
    bit_offset: 10
    bit_size: 1
    enum: Pdl
  - name: ppl
    description: Pin Polarity Lock.
    bit_offset: 11
    bit_size: 1
    enum: Ppl
  - name: atl0
    description: Active Tamper Lock.
    bit_offset: 12
    bit_size: 1
    enum: Atl0
  - name: atl1
    description: Active Tamper Lock.
    bit_offset: 13
    bit_size: 1
    enum: Atl1
  - name: gfl
    description: Glitch Filter Lock.
    bit_offset: 16
    bit_size: 1
    array:
      len: 8
      stride: 1
    enum: Gfl
fieldset/Pdr:
  description: Pin Direction.
  fields:
  - name: tpd
    description: Tamper Pin Direction.
    bit_offset: 0
    bit_size: 1
    array:
      len: 8
      stride: 1
    enum: Tpd
  - name: tpod
    description: Tamper Pin Output Data.
    bit_offset: 16
    bit_size: 1
    array:
      len: 8
      stride: 1
    enum: Tpod
fieldset/Pgfr:
  description: Pin Glitch Filter.
  fields:
  - name: gfw
    description: Glitch Filter Width.
    bit_offset: 0
    bit_size: 6
  - name: gfp
    description: Glitch Filter Prescaler.
    bit_offset: 6
    bit_size: 1
    enum: Gfp
  - name: gfe
    description: Glitch Filter Enable.
    bit_offset: 7
    bit_size: 1
    enum: Gfe
  - name: tpsw
    description: Tamper Pin Sample Width.
    bit_offset: 8
    bit_size: 2
    enum: Tpsw
  - name: tpsf
    description: Tamper Pin Sample Frequency.
    bit_offset: 10
    bit_size: 2
    enum: Tpsf
  - name: tpex
    description: Tamper Pin Expected.
    bit_offset: 16
    bit_size: 2
    enum: Tpex
  - name: tpe
    description: Tamper Pull Enable.
    bit_offset: 24
    bit_size: 1
  - name: tps
    description: Tamper Pull Select.
    bit_offset: 25
    bit_size: 1
    enum: Tps
fieldset/Ppr:
  description: Pin Polarity.
  fields:
  - name: tpp
    description: Tamper Pin n Polarity.
    bit_offset: 0
    bit_size: 1
    array:
      len: 8
      stride: 1
  - name: tpid
    description: Tamper Pin n Input Data.
    bit_offset: 16
    bit_size: 1
    array:
      len: 8
      stride: 1
    enum: Tpid
fieldset/Sr:
  description: Status.
  fields:
  - name: dtf
    description: Digital Tamper Flag.
    bit_offset: 0
    bit_size: 1
  - name: taf
    description: Tamper Acknowledge Flag.
    bit_offset: 1
    bit_size: 1
  - name: tif
    description: Tamper Input n Flag.
    bit_offset: 2
    bit_size: 1
    array:
      len: 10
      stride: 1
  - name: tpf
    description: Tamper Pin n Flag.
    bit_offset: 16
    bit_size: 1
    array:
      len: 8
      stride: 1
fieldset/Ter:
  description: Tamper Enable.
  fields:
  - name: tie
    description: Tamper Input Enable.
    bit_offset: 2
    bit_size: 1
    array:
      len: 10
      stride: 1
  - name: tpe
    description: Tamper Pin Enable.
    bit_offset: 16
    bit_size: 1
    array:
      len: 8
      stride: 1
fieldset/Tsr:
  description: Tamper Seconds.
  fields:
  - name: tts
    description: Tamper Time Seconds.
    bit_offset: 0
    bit_size: 32
enum/Atcs0:
  bit_size: 1
  variants:
  - name: Freq1Hz
    description: 1 Hz prescaler clock.
    value: 0
  - name: Freq64Hz
    description: 64 Hz prescaler clock.
    value: 1
enum/Atcs1:
  bit_size: 1
  variants:
  - name: Freq1Hz
    description: 1 Hz prescaler clock.
    value: 0
  - name: Freq64Hz
    description: 64 Hz prescaler clock.
    value: 1
enum/Atl0:
  bit_size: 1
  variants:
  - name: Lock
    description: Locked and writes are ignored.
    value: 0
  - name: NotLock
    description: Not locked and writes complete as normal.
    value: 1
enum/Atl1:
  bit_size: 1
  variants:
  - name: Lock
    description: Locked and writes are ignored.
    value: 0
  - name: NotLock
    description: Not locked and writes complete as normal.
    value: 1
enum/Crl:
  bit_size: 1
  variants:
  - name: Lock
    description: Locked and writes are ignored.
    value: 0
  - name: NotLock
    description: Not locked and writes complete as normal.
    value: 1
enum/Distam:
  bit_size: 1
  variants:
  - name: NoEffect
    description: No effect.
    value: 0
  - name: AutoDis
    description: Automatically disables the prescaler after tamper detection.
    value: 1
enum/Gfe:
  bit_size: 1
  variants:
  - name: Bypass
    description: Bypasses.
    value: 0
  - name: Enable
    description: Enables.
    value: 1
enum/Gfl:
  bit_size: 1
  variants:
  - name: Lock
    description: Locked and writes are ignored.
    value: 0
  - name: NotLock
    description: Not locked and writes complete as normal.
    value: 1
enum/Gfp:
  bit_size: 1
  variants:
  - name: Freq512Hz
    description: 512 Hz prescaler clock.
    value: 0
  - name: Freq32Khz
    description: 32.768 kHz clock.
    value: 1
enum/Iel:
  bit_size: 1
  variants:
  - name: Lock
    description: Locked and writes are ignored.
    value: 0
  - name: NotLock
    description: Not locked and writes complete as normal.
    value: 1
enum/Lrl:
  bit_size: 1
  variants:
  - name: Lock
    description: Locked and writes are ignored.
    value: 0
  - name: NotLock
    description: Not locked and writes complete as normal.
    value: 1
enum/Pdl:
  bit_size: 1
  variants:
  - name: Lock
    description: Locked and writes are ignored.
    value: 0
  - name: NotLock
    description: Not locked and writes complete as normal.
    value: 1
enum/Ppl:
  bit_size: 1
  variants:
  - name: Lock
    description: Locked and writes are ignored.
    value: 0
  - name: NotLock
    description: Not locked and writes complete as normal.
    value: 1
enum/Srl:
  bit_size: 1
  variants:
  - name: Lock
    description: Locked and writes are ignored.
    value: 0
  - name: NotLock
    description: Not locked and writes complete as normal.
    value: 1
enum/Swr:
  bit_size: 1
  variants:
  - name: NoEffect
    description: No effect.
    value: 0
  - name: SwReset
    description: Perform a software reset.
    value: 1
enum/Tel:
  bit_size: 1
  variants:
  - name: Lock
    description: Locked and writes are ignored.
    value: 0
  - name: NotLock
    description: Not locked and writes complete as normal.
    value: 1
enum/Tpd:
  bit_size: 1
  variants:
  - name: Input
    description: Input.
    value: 0
  - name: Output
    description: Output and drives the inverse of the expected value (tamper pin is asserted).
    value: 1
enum/Tpex:
  bit_size: 2
  variants:
  - name: Zero
    description: Zero/passive tamper.
    value: 0
  - name: ValTamp0
    description: Active Tamper 0 output.
    value: 1
  - name: ValTamp1
    description: Active Tamper 1 output.
    value: 2
  - name: Tamp0XorTamp1
    description: Active Tamper 0 output XORed with Active Tamper 1 output.
    value: 3
enum/Tpid:
  bit_size: 1
  variants:
  - name: Zero
    description: Zero.
    value: 0
  - name: One
    description: One.
    value: 1
enum/Tpod:
  bit_size: 1
  variants:
  - name: Zero
    description: Zero.
    value: 0
  - name: One
    description: One.
    value: 1
enum/Tps:
  bit_size: 1
  variants:
  - name: Assert
    description: Asserts.
    value: 0
  - name: Negate
    description: Negates.
    value: 1
enum/Tpsf:
  bit_size: 2
  variants:
  - name: Cycles8
    description: Every 8 cycles.
    value: 0
  - name: Cycles32
    description: Every 32 cycles.
    value: 1
  - name: Cycles128
    description: Every 128 cycles.
    value: 2
  - name: Cycles512
    description: Every 512 cycles.
    value: 3
enum/Tpsw:
  bit_size: 2
  variants:
  - name: Disable
    description: Continuous monitoring, pin sampling disabled.
    value: 0
  - name: Cycles2
    description: 2 cycles for pull enable and 1 cycle for input buffer enable.
    value: 1
  - name: Cycles4
    description: 4 cycles for pull enable and 2 cycles for input buffer enable.
    value: 2
  - name: Cycles8
    description: 8 cycles for pull enable and 4 cycles for input buffer enable.
    value: 3
enum/Tsl:
  bit_size: 1
  variants:
  - name: Lock
    description: Locked and writes are ignored.
    value: 0
  - name: NotLock
    description: Not locked and writes complete as normal.
    value: 1
enum/Um:
  bit_size: 1
  variants:
  - name: NoEffect
    description: No effect.
    value: 0
  - name: ClearInts
    description: Allows the clearing of interrupts.
    value: 1
