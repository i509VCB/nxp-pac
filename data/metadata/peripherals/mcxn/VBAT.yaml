enum/CapTrim:
  bit_size: 2
  variants:
  - name: Val0
    description: Default (when CAP2_TRIM = 0 and CAP_TRIM[1:0] = 00 ).
    value: 0
  - name: Val1
    description: -1us (when CAP2_TRIM = 0 and CAP_TRIM[1:0] = 01).
    value: 1
  - name: Val2
    description: -2us (when CAP2_TRIM = 0 and CAP_TRIM[1:0] = 10) or or +3.5us (when CAP2_TRIM = 1 and CAP_TRIM[1:0] = 10).
    value: 2
  - name: Val3
    description: -2.5us (when CAP2_TRIM = 0 and CAP_TRIM[1:0] = 11) or +1us (when CAP2_TRIM = 1 and CAP_TRIM[1:0] = 11).
    value: 3
enum/CmpTrim:
  bit_size: 2
  variants:
  - name: CmpTrim0
    description: 760 mV.
    value: 0
  - name: CmpTrim1
    description: 770 mV.
    value: 1
  - name: CmpTrim3
    description: 740 mV.
    value: 3
enum/CoarseAmpGain:
  bit_size: 2
  variants:
  - name: Gain05
    description: ESR Range 0.
    value: 0
  - name: Gain10
    description: ESR Range 1.
    value: 1
  - name: Gain18
    description: ESR Range 2.
    value: 2
  - name: Gain33
    description: ESR Range 3.
    value: 3
enum/DivideTrim:
  bit_size: 1
  variants:
  - name: Cfg0
    description: Clock monitor operates at 1 kHz.
    value: 0
  - name: Cfg1
    description: Clock monitor operates at 64 Hz.
    value: 1
enum/DlyTrim:
  bit_size: 4
  variants:
  - name: DlyTrim0
    description: P current 9(nA) and N Current 6(nA).
    value: 0
  - name: DlyTrim1
