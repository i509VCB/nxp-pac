enum/Dir:
  bit_size: 1
  variants:
  - name: Down
    description: Down direction.
    value: 0
  - name: Up
    description: Up direction.
    value: 1
enum/Hip:
  bit_size: 1
  variants:
  - name: Noaction
    description: No action.
    value: 0
  - name: Home
    description: HOME signal initializes the position counter.
    value: 1
enum/Hirq:
  bit_size: 1
  variants:
  - name: Notrans
    description: Not occurred.
    value: 0
  - name: Transi
    description: Occurred.
    value: 1
enum/Hne:
  bit_size: 1
  variants:
  - name: Pos
    description: Use positive-going edge-to-trigger initialization of position counters UPOS and LPOS.
    value: 0
  - name: Neg
    description: Use negative-going edge-to-trigger initialization of position counters UPOS and LPOS.
    value: 1
enum/Outctl:
  bit_size: 1
  variants:
  - name: Compare
    description: POSMATCH pulses when a match occurs between the position counters (POS) and the corresponding compare value (COMP ).
    value: 0
  - name: Read
    description: POSMATCH pulses when the UPOS, LPOS, REV, or POSD registers are read.
    value: 1
enum/Ph1:
  bit_size: 1
  variants:
  - name: Use
    description: Uses the standard quadrature decoder, where PHASEA and PHASEB represent a two-phase quadrature signal.
    value: 0
  - name: Bypass
    description: Bypasses the quadrature decoder. A positive transition of the PHASEA input generates a count signal. PHASEB input and CTRL[REV] controls the counter direction. If the value of CTRL[REV] and PHASEB are identical; then count is up. If the value of CTRL[REV] and PHASEB is different, then count is down.
    value: 1
enum/Qdn:
  bit_size: 1
  variants:
  - name: Positive
    description: Positive quadrature decoder signal.
    value: 0
  - name: Negative
    description: Negative quadrature decoder signal.
    value: 1
enum/RevDir:
  bit_size: 1
  variants:
  - name: Normal
    description: Counts normally.
    value: 0
  - name: Reverse
    description: Counts in the reverse direction.
    value: 1
enum/Revmod:
  bit_size: 1
  variants:
  - name: Index
    description: Use INDEX pulse.
    value: 0
  - name: Count
    description: Use modulus counting roll-over or roll-under.
    value: 1
enum/Swip:
  bit_size: 1
  variants:
  - name: Noaction
    description: No action.
    value: 0
  - name: Init
    description: Initialize position counter.
    value: 1
enum/Updpos:
  bit_size: 1
  variants:
  - name: Noaction
    description: No action.
    value: 0
  - name: Clear
    description: Clear.
    value: 1
enum/Xirq:
  bit_size: 1
  variants:
  - name: Noind
    description: Not occurred.
    value: 0
  - name: Index
    description: Occurred.
    value: 1
enum/Xne:
  bit_size: 1
  variants:
  - name: Xne0
    description: Use positive edge.
    value: 0
  - name: Xne1
    description: Use negative edge.
    value: 1
