block/Pdm:
  description: MICFIL.
  items:
  - name: ctrl_1
    description: MICFIL Control 1.
    byte_offset: 0
    fieldset: Ctrl1
  - name: ctrl_2
    description: MICFIL Control 2.
    byte_offset: 4
    fieldset: Ctrl2
  - name: stat
    description: MICFIL Status.
    byte_offset: 8
    fieldset: Stat
  - name: fifo_ctrl
    description: MICFIL FIFO Control.
    byte_offset: 16
    fieldset: FifoCtrl
  - name: fifo_stat
    description: MICFIL FIFO Status.
    byte_offset: 20
    fieldset: FifoStat
  - name: datach
    description: MICFIL Output Result.
    array:
      len: 4
      stride: 4
    byte_offset: 36
    access: Read
    fieldset: Datach
  - name: dc_ctrl
    description: MICFIL DC Remover Control.
    byte_offset: 100
    access: Read
    fieldset: DcCtrl
  - name: dc_out_ctrl
    description: MICFIL Output DC Remover Control.
    byte_offset: 104
    fieldset: DcOutCtrl
  - name: range_ctrl
    description: MICFIL Range Control.
    byte_offset: 116
    fieldset: RangeCtrl
  - name: range_stat
    description: MICFIL Range Status.
    byte_offset: 124
    fieldset: RangeStat
  - name: fsync_ctrl
    description: Frame Synchronization Control.
    byte_offset: 128
    fieldset: FsyncCtrl
  - name: verid
    description: Version ID.
    byte_offset: 132
    access: Read
    fieldset: Verid
  - name: param
    description: Parameter.
    byte_offset: 136
    access: Read
    fieldset: Param
fieldset/Ctrl1:
  description: MICFIL Control 1.
  fields:
  - name: chen
    description: Channel Enable.
    bit_offset: 0
    bit_size: 1
    array:
      len: 4
      stride: 1
  - name: fsyncen
    description: Frame Synchronization Enable.
    bit_offset: 16
    bit_size: 1
  - name: decfils
    description: Decimation Filter Enable in Stop.
    bit_offset: 20
    bit_size: 1
    enum: Decfils
  - name: erren
    description: Error Interruption Enable.
    bit_offset: 23
    bit_size: 1
  - name: disel
    description: DMA Interrupt Selection.
    bit_offset: 24
    bit_size: 2
    enum: Disel
  - name: dbge
    description: Module Enable in Debug.
    bit_offset: 26
    bit_size: 1
  - name: sres
    description: Software Reset.
    bit_offset: 27
    bit_size: 1
    enum: Sres
  - name: dbg
    description: Debug Mode.
    bit_offset: 28
    bit_size: 1
    enum: Dbg
  - name: pdmien
    description: MICFIL Enable.
    bit_offset: 29
    bit_size: 1
    enum: Pdmien
  - name: dozen
    description: Stop Enable.
    bit_offset: 30
    bit_size: 1
  - name: mdis
    description: Module Disable.
    bit_offset: 31
    bit_size: 1
    enum: Mdis
fieldset/Ctrl2:
  description: MICFIL Control 2.
  fields:
  - name: clkdiv
    description: Clock Divider.
    bit_offset: 0
    bit_size: 8
    enum: Clkdiv
  - name: clkdivdis
    description: Clock Divider Disable.
    bit_offset: 15
    bit_size: 1
    enum: Clkdivdis
  - name: cicosr
    description: CIC Decimation Rate.
    bit_offset: 16
    bit_size: 4
    enum: Cicosr
  - name: qsel
    description: Quality Mode.
    bit_offset: 25
    bit_size: 3
    enum: Qsel
fieldset/Datach:
  description: MICFIL Output Result.
  fields:
  - name: data
    description: Channel n Data.
    bit_offset: 0
    bit_size: 32
fieldset/DcCtrl:
  description: MICFIL DC Remover Control.
  fields:
  - name: dcconfig
    description: Channel DC Remover Configuration.
    bit_offset: 0
    bit_size: 2
    array:
      len: 4
      stride: 2
    enum: DcCtrlDcconfig
fieldset/DcOutCtrl:
  description: MICFIL Output DC Remover Control.
  fields:
  - name: dcconfig
    description: Channel DC Remover Configuration.
    bit_offset: 0
    bit_size: 2
    array:
      len: 4
      stride: 2
    enum: DcOutCtrlDcconfig
fieldset/FifoCtrl:
  description: MICFIL FIFO Control.
  fields:
  - name: fifowmk
    description: FIFO Watermark Control.
    bit_offset: 0
    bit_size: 4
fieldset/FifoStat:
  description: MICFIL FIFO Status.
  fields:
  - name: fifoovf
    description: FIFO Overflow Exception Flag for Channel.
    bit_offset: 0
    bit_size: 1
    array:
      len: 4
      stride: 1
  - name: fifound
    description: FIFO Underflow Exception Flag for Channel.
    bit_offset: 8
    bit_size: 1
    array:
      len: 4
      stride: 1
fieldset/FsyncCtrl:
  description: Frame Synchronization Control.
  fields:
  - name: fsynclen
    description: Frame Synchronization Window Length.
    bit_offset: 0
    bit_size: 32
fieldset/Param:
  description: Parameter.
  fields:
  - name: npair
    description: Number of Microphone Pairs.
    bit_offset: 0
    bit_size: 4
    enum: Npair
  - name: fifo_ptrwid
    description: FIFO Pointer Width.
    bit_offset: 4
    bit_size: 4
    enum: FifoPtrwid
  - name: fil_out_width_24b
    description: Filter Output Width.
    bit_offset: 8
    bit_size: 1
    enum: FilOutWidth24b
  - name: low_power
    description: Low-Power Decimation Filter.
    bit_offset: 9
    bit_size: 1
  - name: dc_bypass
    description: Input DC Remover Bypass.
    bit_offset: 10
    bit_size: 1
    enum: DcBypass
  - name: dc_out_bypass
    description: Output DC Remover Bypass.
    bit_offset: 11
    bit_size: 1
    enum: DcOutBypass
fieldset/RangeCtrl:
  description: MICFIL Range Control.
  fields:
  - name: rangeadj
    description: Channel Range Adjustment.
    bit_offset: 0
    bit_size: 4
    array:
      len: 4
      stride: 4
fieldset/RangeStat:
  description: MICFIL Range Status.
  fields:
  - name: rangeovf
    description: Channel Range Overflow Error Flag.
    bit_offset: 0
    bit_size: 1
    array:
      len: 4
      stride: 1
  - name: rangeunf
    description: Channel Range Underflow Error Flag.
    bit_offset: 16
    bit_size: 1
    array:
      len: 4
      stride: 1
fieldset/Stat:
  description: MICFIL Status.
  fields:
  - name: chf
    description: Channel Output Data Flag.
    bit_offset: 0
    bit_size: 1
    array:
      len: 4
      stride: 1
    enum: Chf
  - name: bsy_fil
    description: Busy Flag.
    bit_offset: 31
    bit_size: 1
    enum: BsyFil
fieldset/Verid:
  description: Version ID.
  fields:
  - name: feature
    description: Feature Specification Number.
    bit_offset: 0
    bit_size: 16
  - name: minor
    description: Minor Version Number.
    bit_offset: 16
    bit_size: 8
  - name: major
    description: Major Version Number.
    bit_offset: 24
    bit_size: 8
enum/BsyFil:
  bit_size: 1
  variants:
  - name: Stopped
    description: MICFIL is stopped.
    value: 0
  - name: Running
    description: MICFIL is running.
    value: 1
enum/Chf:
  bit_size: 1
  variants:
  - name: WmNotreached
    description: Not surpassed.
    value: 0
  - name: WmReached
    description: Surpassed.
    value: 1
enum/Cicosr:
  bit_size: 4
  variants:
  - name: Cicosr0
    description: CIC oversampling rate = 0.
    value: 0
  - name: Cicosr1
    description: CIC oversampling rate = 1.
    value: 1
  - name: Cicosr22
    description: '...'
    value: 2
  - name: Cicosr23
    description: '...'
    value: 3
  - name: Cicosr24
    description: '...'
    value: 4
  - name: Cicosr25
    description: '...'
    value: 5
  - name: Cicosr26
    description: '...'
    value: 6
  - name: Cicosr27
    description: '...'
    value: 7
  - name: Cicosr28
    description: '...'
    value: 8
  - name: Cicosr29
    description: '...'
    value: 9
  - name: Cicosr15
    description: CIC oversampling rate = 15.
    value: 15
enum/Clkdiv:
  bit_size: 8
  variants:
  - name: Clkdiv0
    description: Internal clock divider value = 0.
    value: 0
  - name: Clkdiv1
    description: Internal clock divider value = 1.
    value: 1
  - name: Clkdiv22
    description: '...'
    value: 2
  - name: Clkdiv23
    description: '...'
    value: 3
  - name: Clkdiv24
    description: '...'
    value: 4
  - name: Clkdiv25
    description: '...'
    value: 5
  - name: Clkdiv26
    description: '...'
    value: 6
  - name: Clkdiv27
    description: '...'
    value: 7
  - name: Clkdiv28
    description: '...'
    value: 8
  - name: Clkdiv29
    description: '...'
    value: 9
  - name: Clkdiv255
    description: Internal clock divider value = 255.
    value: 255
enum/Clkdivdis:
  bit_size: 1
  variants:
  - name: Enable
    description: Enables.
    value: 0
  - name: Disable
    description: Disables.
    value: 1
enum/Dbg:
  bit_size: 1
  variants:
  - name: Normal
    description: Normal.
    value: 0
  - name: Debug
    description: Debug.
    value: 1
enum/DcBypass:
  bit_size: 1
  variants:
  - name: Dcactive
    description: Active.
    value: 0
  - name: Dcbypassed
    description: Disabled.
    value: 1
enum/DcCtrlDcconfig:
  bit_size: 2
  variants:
  - name: DcRem20hz
    description: 20 Hz (PDM_CLK = 3.072 MHz).
    value: 0
  - name: DcRem13p3hz
    description: 13.3 Hz (PDM_CLK = 3.072 MHz).
    value: 1
  - name: DcRem40hz
    description: 40 Hz (PDM_CLK = 3.072 MHz).
    value: 2
  - name: DcRemBypass
    description: DC remover is bypassed.
    value: 3
enum/DcOutBypass:
  bit_size: 1
  variants:
  - name: Dcactive
    description: Active.
    value: 0
  - name: Dcbypassed
    description: Disabled.
    value: 1
enum/DcOutCtrlDcconfig:
  bit_size: 2
  variants:
  - name: DcRem20hz
    description: 20 Hz (FS = 48 kHz).
    value: 0
  - name: DcRem13p3hz
    description: 13.3 Hz (FS = 48 kHz).
    value: 1
  - name: DcRem40hz
    description: 40 Hz (FS = 48 kHz).
    value: 2
  - name: DcRemBypassed
    description: DC remover is bypassed.
    value: 3
enum/Decfils:
  bit_size: 1
  variants:
  - name: Stop
    description: Stops decimation filter.
    value: 0
  - name: Run
    description: Keeps decimation filter running.
    value: 1
enum/Disel:
  bit_size: 2
  variants:
  - name: AllDisabled
    description: Disables DMA and interrupt requests.
    value: 0
  - name: DmareqEnabled
    description: Enables DMA requests.
    value: 1
  - name: IntreqEnabled
    description: Enables interrupt requests.
    value: 2
enum/FifoPtrwid:
  bit_size: 4
  variants:
  - name: Ptrwid0
    description: 0 bits.
    value: 0
  - name: Ptrwid1
    description: 1 bit.
    value: 1
  - name: Ptrwid2
    description: 2 bits.
    value: 2
  - name: Ptrwid33
    description: '...'
    value: 3
  - name: Ptrwid34
    description: '...'
    value: 4
  - name: Ptrwid35
    description: '...'
    value: 5
  - name: Ptrwid36
    description: '...'
    value: 6
  - name: Ptrwid37
    description: '...'
    value: 7
  - name: Ptrwid38
    description: '...'
    value: 8
  - name: Ptrwid39
    description: '...'
    value: 9
  - name: Ptrwid15
    description: 15 bits.
    value: 15
enum/FilOutWidth24b:
  bit_size: 1
  variants:
  - name: Wid16b
    description: 16 bits.
    value: 0
  - name: Wid24b
    description: 24 bits.
    value: 1
enum/Mdis:
  bit_size: 1
  variants:
  - name: Normal
    description: Normal mode.
    value: 0
  - name: LowLeakage
    description: DLL mode.
    value: 1
enum/Npair:
  bit_size: 4
  variants:
  - name: Npair0
    description: None.
    value: 0
  - name: Npair1
    description: 1 pair.
    value: 1
  - name: Npair2
    description: 2 pairs.
    value: 2
  - name: Npair33
    description: '...'
    value: 3
  - name: Npair34
    description: '...'
    value: 4
  - name: Npair35
    description: '...'
    value: 5
  - name: Npair36
    description: '...'
    value: 6
  - name: Npair37
    description: '...'
    value: 7
  - name: Npair38
    description: '...'
    value: 8
  - name: Npair39
    description: '...'
    value: 9
  - name: Npair15
    description: 15 pairs.
    value: 15
enum/Pdmien:
  bit_size: 1
  variants:
  - name: Stopped
    description: Stops MICFIL operation.
    value: 0
  - name: Started
    description: Starts MICFIL operation.
    value: 1
enum/Qsel:
  bit_size: 3
  variants:
  - name: MqMode
    description: Medium-Quality mode.
    value: 0
  - name: HqMode
    description: High-Quality mode.
    value: 1
  - name: Vlq2Mode
    description: Very-Low-Quality 2 mode.
    value: 4
  - name: Vlq1Mode
    description: Very-Low-Quality 1 mode.
    value: 5
  - name: Vlq0Mode
    description: Very-Low-Quality 0 mode.
    value: 6
  - name: LqMode
    description: Low-Quality mode.
    value: 7
enum/Sres:
  bit_size: 1
  variants:
  - name: NoAction
    description: No action.
    value: 0
  - name: SwReset
    description: Software reset.
    value: 1
