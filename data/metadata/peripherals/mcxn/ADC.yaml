  - name: CmdExec2x
    description: Loop one time. Command executes two times.
    value: 1
  - name: CmdExec3x
    description: Loop two times. Command executes three times.
    value: 2
  - name: CmdExecutesCorrespondingTimes3
    description: Loop corresponding number of times. Command executes LOOP + 1 times.
    value: 3
  - name: CmdExecutesCorrespondingTimes4
    description: Loop corresponding number of times. Command executes LOOP + 1 times.
    value: 4
  - name: CmdExecutesCorrespondingTimes5
