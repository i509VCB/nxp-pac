    value: 0
  - name: CompareResultStoreIfTrue
    description: Enabled. Store on true.
    value: 2
  - name: CompareResultKeepConvertingUntilTrueStoreIfTrue
    description: Enabled. Repeat channel acquisition (sample, convert, and compare) until true.
