enum/AdcActive:
  bit_size: 1
  variants:
  - name: NotActive
    description: ADC is idle. There are no pending triggers to service and no active commands are being processed.
    value: 0
  - name: Busy
    description: ADC is processing a conversion, running through the power-up delay, or servicing a trigger.
    value: 1
enum/CalAvgs:
  bit_size: 4
  variants:
  - name: NoAverage
    description: Single conversion.
    value: 0
  - name: Average2
    description: 2 conversions averaged.
    value: 1
  - name: Average4
    description: 4 conversions averaged.
    value: 2
  - name: Average8
    description: 8 conversions averaged.
    value: 3
  - name: Average16
    description: 16 conversions averaged.
    value: 4
  - name: Average32
    description: 32 conversions averaged.
    value: 5
  - name: Average64
    description: 64 conversions averaged.
    value: 6
  - name: Average128
    description: 128 conversions averaged.
    value: 7
  - name: Average256
    description: 256 conversions averaged.
    value: 8
  - name: Average512
    description: 512 conversions averaged.
    value: 9
  - name: Average1024
    description: 1024 conversions averaged.
    value: 10
enum/CalRdy:
  bit_size: 1
  variants:
  - name: NotSet
    description: Calibration is incomplete or has not been run.
    value: 0
  - name: HardwareCalStepCompleted
    description: ADC is calibrated.
    value: 1
enum/CalReq:
  bit_size: 1
  variants:
