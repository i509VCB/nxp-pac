  - name: Average4
    description: '4.'
    value: 2
  - name: Average8
    description: '8.'
    value: 3
  - name: Average16
    description: '16.'
    value: 4
  - name: Average32
    description: '32.'
    value: 5
  - name: Average64
    description: '64.'
    value: 6
  - name: Average128
    description: '128.'
    value: 7
  - name: Average256
    description: '256.'
    value: 8
  - name: Average512
    description: '512.'
    value: 9
  - name: Average1024
    description: '1024.'
    value: 10
enum/CmdhCmpen:
