    value: 0
  - name: LogicZero
    description: Logic zero.
    value: 1
enum/Feature:
  bit_size: 16
  variants:
  - name: Standard
    description: Standard feature set.
    value: 1
  - name: Modem
    description: Standard feature set with MODEM and IrDA support.
    value: 3
  - name: ModemIdle
    description: Enhanced feature set with full MODEM, IrDA, and enhanced idle detection.
    value: 7
enum/Idlecfg:
  bit_size: 3
