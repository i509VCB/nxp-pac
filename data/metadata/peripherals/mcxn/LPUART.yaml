  bit_size: 1
  variants:
  - name: Short
    description: 9 to 13 bit times.
    value: 0
  - name: Long
    description: 12 to 15 bit times.
    value: 1
enum/Cfg:
  bit_size: 2
  variants:
  - name: CntChar
    description: Becomes 1 after timeout characters are received.
    value: 0
  - name: CntIdle
    description: Becomes 1 when idle for timeout bit clocks.
    value: 1
  - name: CntBusyIdle
    description: Becomes 1 when idle for timeout bit clocks following the next character.
    value: 2
  - name: CntCharIdle
    description: Becomes 1 when idle for at least timeout bit clocks, but a new character is detected before the extended idle timeout is reached.
    value: 3
enum/Dozeen:
  bit_size: 1
  variants:
  - name: Enabled
    description: Enable.
    value: 0
  - name: Disabled
    description: Disable.
    value: 1
enum/Dtr:
