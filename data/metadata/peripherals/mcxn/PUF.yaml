enum/ConfigType:
  bit_size: 4
  variants:
  - name: Safe
    description: Indicates that PUF configuration is Safe.
    value: 1
  - name: Plus
    description: Indicates that PUF configuration is Plus.
    value: 2
enum/ConfigWrap:
  bit_size: 1
  variants:
  - name: Enable
    description: Indicates that Wrap is not included.
    value: 0
  - name: Disable
    description: Indicates that Wrap is included.
    value: 1
enum/LastOperation:
  bit_size: 8
  variants:
  - name: LoProgress
    description: Indicates that the operation is in progress.
    value: 0
  - name: LoEnroll
    description: Indicates that the last operation was Enroll.
    value: 1
  - name: LoStart
    description: Indicates that the last operation was Start.
    value: 2
  - name: LoReconstruct
    description: Indicates that the last operation was Reconstruct.
    value: 3
  - name: LoStop
    description: Indicates that the last operation was Stop.
    value: 5
  - name: LoGetKey
    description: Indicates that the last operation was Get Key.
    value: 6
  - name: LoUnwrap
    description: Indicates that the last operation was Unwrap.
    value: 7
  - name: LoWrapGenRnd
    description: Indicates that the last operation was Wrap Generated Random.
    value: 8
  - name: LoWrap
    description: Indicates that the last operation was Wrap.
    value: 9
  - name: LoGenRnd
    description: Indicates that the last operation was Generate Random.
    value: 15
  - name: LoTestMemory
    description: Indicates that the last operation was Test Memory.
    value: 30
  - name: LoTestPuf
    description: Indicates that the last operation was Test PUF.
    value: 31
  - name: LoInitialization
    description: Indicates that the last operation was Initialization.
    value: 32
  - name: LoZeroize
    description: Indicates that the last operation was Zeroize.
    value: 47
enum/LcState:
  bit_size: 8
  variants:
  - name: OemOpen
    description: OEM Develop.
    value: 3
  - name: OemSecureWorld
    description: OEM Develop 2.
    value: 7
  - name: OemClosed
    description: OEM In-field.
    value: 15
  - name: OemFieldReturn
    description: OEM Field return.
    value: 31
  - name: FieldReturnNxp
    description: NXP Field Return/Failure Analysis.
    value: 63
  - name: OemLocked
    description: In-field Locked.
    value: 207
  - name: OemShredded
    description: Bricked.
    value: 255
enum/ResultCode:
  bit_size: 8
  variants:
  - name: Ok
    description: Indicates that the last operation was successful or operation is in progress.
    value: 0
  - name: ErrProduct
    description: Indicates that the AC is not for the current product/version.
    value: 240
  - name: ErrProductPh2
    description: Indicates that the AC in the second phase is not for the current product/version.
    value: 241
  - name: ErrTransfer
    description: Indicates that the AC is corrupted.
    value: 242
  - name: ErrTransferPh2
    description: Indicates that the AC in the second phase is corrupted.
    value: 243
  - name: ErrAuth
    description: Indicates that the authentication of the provided AC failed.
    value: 244
  - name: ErrAuthPh2
    description: Indicates that the authentication of the provided AC failed in the second phase.
    value: 245
  - name: ErrPufQuality
    description: Indicates that the SRAM PUF quality verification fails.
    value: 246
  - name: ErrContext
    description: Indicates that the incorrect or unsupported context is provided.
    value: 247
  - name: ErrDestination
    description: Indicates that a data destination was set that is not allowed according to other settings and the current PUF state.
    value: 248
  - name: Failure
    description: Indicates that the PUF SRAM access has failed.
    value: 255
enum/SramIntClrStatusApbErr:
  bit_size: 1
  variants:
  - name: NoEffect
    description: No effect.
    value: 0
  - name: Enable
    description: Clears the APB_ERR bit field in register INT_STATUS. Automatically reset by the Hardware.
    value: 1
enum/SramIntSetStatusApbErr:
  bit_size: 1
  variants:
  - name: NoEffect
    description: No effect.
    value: 0
  - name: Enable
    description: Clears the APB_ERR bit field in register INT_STATUS. Automatically reset by the Hardware.
    value: 1
