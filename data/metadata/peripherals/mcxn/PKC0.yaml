    description: Length of universal pointer calculation.
    bit_offset: 0
    bit_size: 8
fieldset/PkcUptr:
  description: Universal pointer FUP program.
  fields:
  - name: ptr
    description: Pointer to start address of PKC FUP program.
    bit_offset: 0
    bit_size: 32
fieldset/PkcUptrt:
  description: Universal pointer FUP table.
  fields:
