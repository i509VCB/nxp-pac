    description: Write 1 to reset PKC_ACCESS_ERR SFR.
    bit_offset: 0
    bit_size: 1
fieldset/PkcCfg:
  description: Configuration register.
  fields:
  - name: idleop
    description: Idle operation feature not available in this version (flag is don't care).
    bit_offset: 0
    bit_size: 1
  - name: rfu1
    description: RFU.
    bit_offset: 1
    bit_size: 1
  - name: rfu2
    description: RFU.
    bit_offset: 2
    bit_size: 1
  - name: clkrnd
    description: Clock randomization feature not available in this version (flag is don't care).
    bit_offset: 3
    bit_size: 1
  - name: redmulnoise
    description: Noise in reduced multiplier mode feature not available in this version (flag is don't care).
    bit_offset: 4
    bit_size: 1
  - name: rnddly
    description: Random delay feature not available in this version (flag is don't care).
    bit_offset: 5
    bit_size: 3
  - name: sbxnoise
    description: Noise feature not available in this version (flag is don't care).
    bit_offset: 8
    bit_size: 1
  - name: alpnoise
    description: Noise feature not available in this version (flag is don't care).
    bit_offset: 9
    bit_size: 1
  - name: fmulnoise
    description: Noise feature not available in this version (flag is don't care).
    bit_offset: 10
    bit_size: 1
fieldset/PkcCtrl:
  description: Control Register.
  fields:
  - name: reset
    description: PKC reset control bit.
    bit_offset: 0
    bit_size: 1
  - name: stop
    description: Freeze PKC calculation.
    bit_offset: 1
    bit_size: 1
  - name: god1
    description: Control bit to start direct operation using parameter set 1.
    bit_offset: 2
    bit_size: 1
  - name: god2
    description: Control bit to start direct operation using parameter set 2.
    bit_offset: 3
    bit_size: 1
  - name: gom1
    description: Control bit to start MC pattern using parameter set 1.
    bit_offset: 4
    bit_size: 1
  - name: gom2
    description: Control bit to start MC pattern using parameter set 2.
    bit_offset: 5
    bit_size: 1
  - name: gou
    description: Control bit to start pipe operation.
    bit_offset: 6
    bit_size: 1
  - name: gf2conv
    description: Convert to GF2 calculation modes.
    bit_offset: 7
    bit_size: 1
  - name: clrcache
    description: Clear universal pointer cache.
    bit_offset: 8
    bit_size: 1
  - name: cache_en
    description: Enable universal pointer cache.
    bit_offset: 9
    bit_size: 1
  - name: redmul
    description: Reduced multiplier mode.
    bit_offset: 10
    bit_size: 2
    enum: Redmul
fieldset/PkcIntClrEnable:
  description: Interrupt enable clear.
  fields:
  - name: en_pdone
    description: Write to clear PDONE interrupt enable flag (PKC_INT_ENABLE[EN_PDONE]=0).
    bit_offset: 0
    bit_size: 1
fieldset/PkcIntClrStatus:
  description: Interrupt status clear.
  fields:
  - name: int_pdone
    description: Write to clear End-of-computation status flag (PKC_INT_STATUS[INT_PDONE]=0).
    bit_offset: 0
    bit_size: 1
fieldset/PkcIntEnable:
  description: Interrupt enable.
  fields:
  - name: en_pdone
    description: PDONE interrupt enable flag.
    bit_offset: 0
    bit_size: 1
fieldset/PkcIntSetEnable:
  description: Interrupt enable set.
  fields:
  - name: en_pdone
    description: Write to set PDONE interrupt enable flag (PKC_INT_ENABLE[EN_PDONE]=1).
    bit_offset: 0
    bit_size: 1
fieldset/PkcIntSetStatus:
  description: Interrupt status set.
  fields:
  - name: int_pdone
    description: Write to set End-of-computation status flag (PKC_INT_STATUS[INT_PDONE]=1) to trigger a PKC interrupt via software, e.
    bit_offset: 0
    bit_size: 1
fieldset/PkcIntStatus:
  description: Interrupt status.
  fields:
  - name: int_pdone
    description: End-of-computation status flag.
    bit_offset: 0
    bit_size: 1
