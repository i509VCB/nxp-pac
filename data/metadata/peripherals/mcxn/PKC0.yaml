fieldset/PkcAccessErr:
  description: Access Error.
  fields:
  - name: apb_notav
    description: APB Error.
    bit_offset: 0
    bit_size: 1
  - name: apb_wrgmd
    description: APB Error.
    bit_offset: 1
    bit_size: 1
  - name: apb_master
    description: APB Master that triggered first APB error (APB_WRGMD or APB_NOTAV).
    bit_offset: 4
    bit_size: 4
  - name: ahb
    description: AHB Error.
    bit_offset: 10
    bit_size: 1
  - name: pkcc
    description: Error in PKC coprocessor kernel.
    bit_offset: 16
    bit_size: 1
  - name: fdet
    description: Error due to error detection circuitry.
    bit_offset: 17
    bit_size: 1
  - name: ctrl
    description: Error in PKC software control.
    bit_offset: 18
    bit_size: 1
  - name: ucrc
    description: Error in layer2 CRC check.
    bit_offset: 19
    bit_size: 1
fieldset/PkcAccessErrClr:
  description: Clear Access Error.
  fields:
