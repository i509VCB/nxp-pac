    description: Pointer to start address of PKC FUP table.
    bit_offset: 0
    bit_size: 32
fieldset/PkcVersion:
  description: PKC version register.
  fields:
  - name: mulsize
    description: Native multiplier size and operand granularity.
    bit_offset: 0
    bit_size: 2
    enum: Mulsize
  - name: mcavail
    description: MC feature (layer1 calculation) is available.
    bit_offset: 2
    bit_size: 1
  - name: upavail
    description: UP feature (layer2 calculation) is available.
    bit_offset: 3
    bit_size: 1
  - name: upcacheavail
    description: UP cache is available.
    bit_offset: 4
    bit_size: 1
  - name: gf2avail
    description: GF2 calculation modes are available.
    bit_offset: 5
    bit_size: 1
  - name: paramnum
    description: Number of parameter sets for real calculation.
    bit_offset: 6
    bit_size: 2
  - name: sbx0avail
    description: SBX0 operation is available.
    bit_offset: 8
    bit_size: 1
  - name: sbx1avail
    description: SBX1 operation is available.
    bit_offset: 9
    bit_size: 1
  - name: sbx2avail
    description: SBX2 operation is available.
    bit_offset: 10
    bit_size: 1
  - name: sbx3avail
    description: SBX3 operation is available.
    bit_offset: 11
    bit_size: 1
  - name: mcreconf_size
    description: Size of reconfigurable MC table in bytes.
    bit_offset: 12
    bit_size: 8
fieldset/PkcXyptr1:
  description: X+Y pointer register, parameter set 1.
  fields:
  - name: xptr
    description: Start address of X operand in PKCRAM with byte granularity.
    bit_offset: 0
    bit_size: 16
  - name: yptr
    description: Start address of Y operand in PKCRAM with byte granularity.
    bit_offset: 16
    bit_size: 16
fieldset/PkcXyptr2:
  description: X+Y pointer register, parameter set 2.
  fields:
  - name: xptr
    description: Start address of X operand in PKCRAM with byte granularity.
    bit_offset: 0
    bit_size: 16
  - name: yptr
    description: Start address of Y operand in PKCRAM with byte granularity.
    bit_offset: 16
    bit_size: 16
fieldset/PkcZrptr1:
  description: Z+R pointer register, parameter set 1.
  fields:
  - name: zptr
    description: Start address of Z operand in PKCRAM with byte granularity or constant for calculation modes using CONST.
    bit_offset: 0
    bit_size: 16
  - name: rptr
    description: Start address of R result in PKCRAM with byte granularity.
    bit_offset: 16
    bit_size: 16
fieldset/PkcZrptr2:
  description: Z+R pointer register, parameter set 2.
  fields:
  - name: zpt
    description: Start address of Z operand in PKCRAM with byte granularity or constant for calculation modes using CONST.
    bit_offset: 0
    bit_size: 16
  - name: rptr
    description: Start address of R result in PKCRAM with byte granularity.
    bit_offset: 16
    bit_size: 16
enum/Mulsize:
  bit_size: 2
  variants:
  - name: Value32b
    description: 32-bit multiplier.
    value: 1
  - name: Value64b
    description: 64-bit multiplier.
    value: 2
  - name: Value128b
    description: 128-bit multiplier.
    value: 3
enum/Redmul:
  bit_size: 2
  variants:
  - name: Fullsz
    description: full size mode, 3 least significant bits of pointer and length are ignored, minimum supported length 0x0008.
    value: 0
  - name: Value64bit
    description: 64-bit mode, 3 least significant bits of pointer and length are ignored, minimum supported length 0x0008.
    value: 2
