    description: Write 1 to reset module (0 has no effect).
    bit_offset: 0
    bit_size: 1
fieldset/PkcStatus:
  description: Status Register.
  fields:
  - name: activ
    description: PKC ACTIV.
    bit_offset: 0
    bit_size: 1
  - name: carry
    description: Carry overflow flag.
    bit_offset: 1
    bit_size: 1
  - name: zero
    description: Zero result flag.
    bit_offset: 2
    bit_size: 1
  - name: goany
    description: Combined GO status flag.
    bit_offset: 3
    bit_size: 1
  - name: locked
    description: Parameter set locked.
    bit_offset: 5
    bit_size: 2
fieldset/PkcUlen:
  description: Universal pointer length.
