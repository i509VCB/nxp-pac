  - name: chopen
    description: Chop Oscillator Enable.
    bit_offset: 3
    bit_size: 1
    enum: Chopen
  - name: icompen
    description: Current Compensation Enable.
    bit_offset: 4
    bit_size: 1
    enum: Icompen
  - name: regen
    description: Regulator Enable.
    bit_offset: 5
    bit_size: 1
    enum: Regen
  - name: hi_pwr_lv
    description: High-Power Level.
    bit_offset: 11
    bit_size: 1
    enum: HiPwrLv
