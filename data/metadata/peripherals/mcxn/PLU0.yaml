    description: Input select register for LUTn (0 to 25), Inputx (5 inputs).
    array:
      len: 5
      stride: 4
    byte_offset: 0
    fieldset: LutInpMux
block/Plu0:
  description: Programmable Logic Unit (PLU).
  items:
