    bit_offset: 9
    bit_size: 1
  - name: st_dap_enable_cpu0
    description: When DAP to AP0 for CPU0 (CM33) debug access is allowed, this bit indicates state 1.
    bit_offset: 10
    bit_size: 1
  - name: st_dap_enable_cpu1
