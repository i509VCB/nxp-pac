    value: 7
  - name: Zz260
    description: XADR decreased by 1 after row. For READ operations only, XADR is decreased by 1 after YADR decreases to 0.
    value: 8
  - name: Zz261
    description: XADR decreased by 1. For READ operations only, XADR is decreased by 1 after each read cycle.
