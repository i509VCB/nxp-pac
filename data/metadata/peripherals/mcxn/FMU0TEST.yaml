    description: CKBD pattern. For READ operations only, compare DOUT with checkerboard data pattern for each read cycle.
    value: 0
  - name: Zz233
    description: ICKBD pattern. For READ operations only, compare DOUT with inverse checkerboard data pattern for each read cycle.
    value: 1
  - name: Zz234
    description: Diagonal pattern. Used for READ operations only, compare DOUT to diagonal pattern.
    value: 2
  - name: Zz235
    description: Fixed data pattern. For READ operations, comparison to DOUT for selected groups; refer to R_ADR_CTRL[GRPSEL] for modules with multiple groups.
    value: 3
  - name: Zz236
    description: Random data pattern which will be generated based on the initial seed set in R_DATA; for READ operations, used for DOUT comparison of selected groups. For PROG operations, used to control DIN of selected groups.
    value: 4
  - name: Zz237
    description: DOUT based pattern. For READ operations only, DOUT of selected group will be latched in R_DATA. If more than one group is selected in R_ADR_CTRL[GRPSEL], the group with the lower index will be latched.
    value: 5
  - name: Zz238
    description: R_DATA based pattern. For READ operations, expected DOUT value of selected groups equals to R_DATA when XADR[0]==YADR[0] or ~R_DATA when XADR[0]!=YADR[0]. For PROG operations, DIN of selected groups equals R_DATA when XADR[0]==YADR[0] or ~R_DATA when XADR[0]!=YADR[0].
    value: 6
  - name: Zz239
    description: SCAN-IO pattern. For READ operations, control expected DOUT value of selected groups to SCAN-IO data pattern. For PROG operations, control DIN of selected groups to SCAN-IO data pattern.
    value: 7
  - name: Zz240
    description: REPAIR set. For PROG operation to IFR1(7,1) and IFR1(7,2), R_REPAIR0_0 and R_REPAIR0_1 or R_REPAIR1_0 and R_REPAIR1_1 will control DIN. For READ operation on IFR1(7,1) and IFR1(7,2), DOUT will be compared against R_REPAIR0_0 and R_REPAIR0_1 or R_REPAIR1_0 andR_REPAIR1_1. When this option is selected, only one flash block can be selected.
    value: 8
  - name: Zz241
    description: REPAIR load. For READ operation only, DOUT from IFR1(7,1) and IFR1(7,2) is loaded to R_REPAIR0 and R_REPAIR1.
    value: 9
