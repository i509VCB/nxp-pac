    fieldset: Verid
  - name: param
    description: Parameters.
    byte_offset: 4
    access: Read
    fieldset: Param
  - name: sr
    description: Status.
    byte_offset: 8
    fieldset: Sr
  - name: rwc
    description: Read and Write Control.
    byte_offset: 16
    fieldset: Rwc
  - name: rlc
    description: Reload Control.
    byte_offset: 20
    fieldset: Rlc
  - name: pcr
    description: Power Control.
    byte_offset: 24
    fieldset: Pcr
  - name: wdata
    description: Write Data.
    byte_offset: 32
    fieldset: Wdata
  - name: rdata
    description: Read Data.
    byte_offset: 36
    access: Read
    fieldset: Rdata
  - name: timing1
    description: Timing1.
    byte_offset: 48
    fieldset: Timing1
  - name: timing2
    description: Timing2.
    byte_offset: 52
    fieldset: Timing2
  - name: lock
    description: Lock.
    byte_offset: 512
    fieldset: Lock
  - name: secure
    description: Secure.
    byte_offset: 516
    access: Read
    fieldset: Secure
  - name: secure_inv
    description: Inverted Secure.
    byte_offset: 520
    access: Read
    fieldset: SecureInv
  - name: dbg_key
    description: Debug and Key.
    byte_offset: 524
    access: Read
    fieldset: DbgKey
  - name: misc_cfg
    description: MISC Config.
    byte_offset: 528
    fieldset: MiscCfg
  - name: phantom_cfg
    description: PHANTOM Config.
    byte_offset: 532
    fieldset: PhantomCfg
  - name: flex_cfg0
