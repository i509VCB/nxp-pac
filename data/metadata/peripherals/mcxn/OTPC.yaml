    bit_offset: 13
    bit_size: 1
    enum: ReadEfuse
  - name: read_update
    description: Read update.
    bit_offset: 14
    bit_size: 1
  - name: wr_unlock
    description: Write Unlock.
    bit_offset: 16
    bit_size: 16
fieldset/Secure:
  description: Secure.
  fields:
  - name: dat
    description: Data.
    bit_offset: 0
    bit_size: 32
fieldset/SecureInv:
  description: Inverted Secure.
  fields:
  - name: dat
    description: Data.
    bit_offset: 0
    bit_size: 32
fieldset/Sr:
  description: Status.
  fields:
  - name: busy
    description: Busy status.
    bit_offset: 0
    bit_size: 1
  - name: error
    description: Error flag.
    bit_offset: 1
    bit_size: 1
  - name: ecc_sf
    description: ECC single fault.
    bit_offset: 2
    bit_size: 1
  - name: ecc_df
    description: ECC double fault.
    bit_offset: 3
    bit_size: 1
  - name: tri_f
    description: Triple voting fault.
    bit_offset: 4
    bit_size: 1
  - name: rd_fuse_lock
    description: Read fuse lock error.
    bit_offset: 8
    bit_size: 1
  - name: wr_fuse_lock
    description: Write fuse lock error.
    bit_offset: 9
    bit_size: 1
  - name: rd_reg_lock
    description: Read register lock error.
    bit_offset: 10
    bit_size: 1
  - name: wr_reg_lock
    description: Write register lock error.
    bit_offset: 11
    bit_size: 1
  - name: wr_reg_busy
    description: Write register when busy error.
    bit_offset: 12
    bit_size: 1
  - name: wr_power_off
    description: Write when power off error.
    bit_offset: 13
    bit_size: 1
  - name: fsm
    description: Finite-state machine error.
    bit_offset: 16
    bit_size: 1
  - name: flc
    description: Fuse load counter error.
    bit_offset: 17
    bit_size: 1
  - name: adc
    description: Address and data compare error.
    bit_offset: 18
    bit_size: 1
  - name: irc
    description: Inverted register compare error.
    bit_offset: 19
    bit_size: 1
  - name: fsc
    description: Fuse and shadow register compare error.
    bit_offset: 20
    bit_size: 1
fieldset/Timing1:
  description: Timing1.
  fields:
  - name: taddr
    description: Address to STROBE setup and hold time.
    bit_offset: 0
    bit_size: 4
  - name: trelax
    description: CSB, PGENB and LOAD to STROBE setup and hold time.
    bit_offset: 4
    bit_size: 4
  - name: trd
    description: Read strobe pulse width time.
    bit_offset: 8
    bit_size: 6
  - name: tps
    description: PS to CSB setup and hold time between power switch and chip select assertion.
    bit_offset: 16
    bit_size: 6
  - name: tpd
    description: PD to CSB setup time between power down signal deassertion and chip select signal assertion.
    bit_offset: 24
    bit_size: 8
fieldset/Timing2:
  description: Timing2.
  fields:
  - name: tpgm
    description: Typical program strobe pulse width time.
    bit_offset: 0
    bit_size: 12
fieldset/Verid:
  description: Version ID.
  fields:
  - name: feature
    description: Feature Specification Number.
    bit_offset: 0
    bit_size: 16
    enum: Feature
  - name: minor
    description: Minor Version Number.
    bit_offset: 16
    bit_size: 8
  - name: major
    description: Major Version Number.
    bit_offset: 24
    bit_size: 8
fieldset/Wdata:
  description: Write Data.
  fields:
  - name: dat
    description: Write data.
    bit_offset: 0
    bit_size: 32
enum/Feature:
  bit_size: 16
  variants:
  - name: Standard
    description: Standard feature set.
    value: 0
enum/Hvreq:
  bit_size: 1
  variants:
  - name: TurnOff
    description: Turn off.
    value: 0
  - name: TurnOn
    description: Turn on.
    value: 1
enum/Lvreq:
  bit_size: 1
  variants:
  - name: TurnOff
    description: Turn off.
    value: 0
  - name: TurnOn
    description: Turn on.
    value: 1
enum/Pdreq:
  bit_size: 1
  variants:
  - name: NoAction
    description: PD pin is set to low when OTPC is in idle state. It means EFUSE hardmacro is in standby mode. Idle state means OTPC is not in read and program modes.
    value: 0
  - name: PowerDn
    description: PD pin is set to high when OTPC is in idle state. It means EFUSE hardmacro is in power down mode.
    value: 1
enum/ReadEfuse:
  bit_size: 1
  variants:
  - name: Program
    description: Starts program operation when the WR_UNLOCK value is 0x9527; otherwise, takes no action.
    value: 0
  - name: Read
    description: Starts read operation.
    value: 1
enum/ReloadShadows:
  bit_size: 1
  variants:
  - name: NoAction
    description: No action (when writing) or reload complete (when reading).
    value: 0
  - name: Reload
    description: Reload.
    value: 1
enum/WrAll1s:
  bit_size: 1
  variants:
  - name: UseWdata
    description: Uses the WDATA value.
    value: 0
  - name: UseAll1s
    description: Writes all 1s.
    value: 1
