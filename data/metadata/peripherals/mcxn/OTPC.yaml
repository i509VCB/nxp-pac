fieldset/MiscCfg:
  description: MISC Config.
  fields:
  - name: dat
    description: Data.
    bit_offset: 0
    bit_size: 32
fieldset/Param:
  description: Parameters.
  fields:
  - name: num_fuse
    description: Number of fuse bytes.
    bit_offset: 0
    bit_size: 16
