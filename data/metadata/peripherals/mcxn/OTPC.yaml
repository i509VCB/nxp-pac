  description: Power Control.
  fields:
  - name: hvreq
    description: Strong switch request.
    bit_offset: 0
    bit_size: 1
    enum: Hvreq
  - name: lvreq
    description: Weak switch request.
    bit_offset: 1
    bit_size: 1
    enum: Lvreq
  - name: pdreq
    description: Power down request.
    bit_offset: 2
    bit_size: 1
    enum: Pdreq
