  description: Read Data.
  fields:
  - name: dat
    description: Read data.
    bit_offset: 0
    bit_size: 32
fieldset/Rlc:
  description: Reload Control.
  fields:
  - name: reload_shadows
    description: Reload shadow registers.
    bit_offset: 0
    bit_size: 1
    enum: ReloadShadows
fieldset/Rwc:
  description: Read and Write Control.
