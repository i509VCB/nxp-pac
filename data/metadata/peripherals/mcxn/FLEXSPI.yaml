    value: 0
  - name: Value1
    description: Protected. Only secure IPS controller can change the value of LUTCR and write to LUT memory.
    value: 1
enum/Readaddropt:
  bit_size: 1
  variants:
  - name: Val0
    description: AHB read burst start address alignment is limited when flash memory is accessed in parallel mode or flash is word-addressable.
    value: 0
  - name: Val1
    description: AHB read burst start address alignment is not limited. FlexSPI fetches more data than the AHB burst requires for address alignment.
    value: 1
enum/Readszalign:
  bit_size: 1
  variants:
  - name: Val0
    description: Register settings such as PREFETCH_EN determine AHB read size.
    value: 0
  - name: Val1
    description: AHB read size to up size to 8 bytes aligned, no prefetching.
    value: 1
