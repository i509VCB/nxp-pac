  - name: Val1
    description: HADDR REMAP Enabled.
    value: 1
enum/Resumedisable:
  bit_size: 1
  variants:
  - name: Val0
    description: Suspended AHB read prefetch resumes when AHB is IDLE.
    value: 0
  - name: Val1
    description: Suspended AHB read prefetch does not resume once aborted,.
    value: 1
enum/RxClkSrcDiff:
  bit_size: 1
  variants:
  - name: Value0
    description: Use MCR0[RXCLKSRC] for Port A and Port B. MCR2[RXCLKSRC_B] is ignored and MCR0[RXCLKSRC] selects the Sample Clock source for Flash Reading of both ports A and B.
    value: 0
  - name: Value1
    description: Use MCR0[RXCLKSRC] for Port A, and MCR2[RXCLKSRC_B] for Port B. MCR0[RXCLKSRC] selects the Sample Clock source for Flash Reading of port A (A_SCLK) and MCR2[RXCLKSRC_B] selects the Sample Clock source for Flash Reading of port B (B_SCLK).
    value: 1
enum/Rxclksrc:
  bit_size: 2
  variants:
  - name: Val0
    description: Dummy Read strobe that FlexSPI generates, looped back internally.
    value: 0
  - name: Val1
    description: Dummy Read strobe that FlexSPI generates, looped back from DQS pad.
    value: 1
  - name: Val2
    description: SCLK output clock and looped back from SCLK pad.
    value: 2
  - name: Val3
    description: Flash-memory-provided read strobe and input from DQS pad.
    value: 3
enum/RxclksrcB:
  bit_size: 2
  variants:
  - name: Val0
    description: Dummy read strobe that FlexSPI generates, looped back internally.
    value: 0
  - name: Val1
    description: Dummy read strobe that FlexSPI generates, looped back from DQS pad.
    value: 1
  - name: Val2
    description: SCLK output clock and looped back from SCLK pad.
    value: 2
  - name: Val3
    description: Flash-memory-provided read strobe and input from DQS pad.
    value: 3
enum/Rxdmaen:
  bit_size: 1
  variants:
  - name: Val0
    description: Disabled. The processor reads the FIFO.
    value: 0
  - name: Val1
    description: Enabled. DMA reads the FIFO.
    value: 1
enum/Samedeviceen:
  bit_size: 1
  variants:
  - name: IndividualParallel
    description: In Individual mode, FLSHA1CRx and FLSHA2CRx, FLSHB1CRx and FLSHB2CRx settings are applied to Flash A1, A2, B1, B2 separately. In Parallel mode, FLSHA1CRx register setting is applied to Flash A1 and B1, FLSHA2CRx register setting is applied to Flash A2 and B2. FLSHB1CRx and FLSHB2CRx register settings are ignored.
    value: 0
  - name: Enable
    description: FLSHA1CR0, FLSHA1CR1, and FLSHA1CR2 register settings are applied to Flash A1, A2, B1, B2. FLSHA2CRx, FLSHB1CRx, and FLSHB2CRx settings are ignored.
    value: 1
enum/Sckbdiffopt:
