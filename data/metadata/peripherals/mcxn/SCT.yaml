  - name: startmsk_h
    description: Start Event High.
    bit_offset: 16
    bit_size: 16
fieldset/State:
  description: State Variable.
  fields:
  - name: state_l
    description: State Variable Low.
    bit_offset: 0
    bit_size: 5
  - name: state_h
    description: State Variable High.
    bit_offset: 16
    bit_size: 5
fieldset/Stop:
  description: Stop Event Select.
  fields:
  - name: stopmsk_l
    description: Stop Event Low.
    bit_offset: 0
    bit_size: 16
  - name: stopmsk_h
    description: Stop Event High.
    bit_offset: 16
    bit_size: 16
enum/BidirH:
  bit_size: 1
  variants:
  - name: Up
    description: Up.
    value: 0
  - name: UpDown
    description: Up-down.
    value: 1
enum/BidirL:
  bit_size: 1
  variants:
  - name: Up
    description: Up.
    value: 0
  - name: UpDown
    description: Up-down.
    value: 1
enum/Cksel:
  bit_size: 4
  variants:
  - name: Input0RisingEdges
    description: Rising edges on input 0.
    value: 0
  - name: Input0FallingEdges
    description: Falling edges on input 0.
    value: 1
  - name: Input1RisingEdges
    description: Rising edges on input 1.
    value: 2
  - name: Input1FallingEdges
    description: Falling edges on input 1.
    value: 3
  - name: Input2RisingEdges
    description: Rising edges on input 2.
    value: 4
  - name: Input2FallingEdges
    description: Falling edges on input 2.
    value: 5
  - name: Input3RisingEdges
    description: Rising edges on input 3.
    value: 6
  - name: Input3FallingEdges
    description: Falling edges on input 3.
    value: 7
  - name: Input4RisingEdges
    description: Rising edges on input 4.
    value: 8
  - name: Input4FallingEdges
    description: Falling edges on input 4.
    value: 9
  - name: Input5RisingEdges
    description: Rising edges on input 5.
    value: 10
  - name: Input5FallingEdges
    description: Falling edges on input 5.
    value: 11
  - name: Input6RisingEdges
    description: Rising edges on input 6.
    value: 12
  - name: Input6FallingEdges
    description: Falling edges on input 6.
    value: 13
  - name: Input7RisingEdges
    description: Rising edges on input 7.
    value: 14
  - name: Input7FallingEdges
    description: Falling edges on input 7.
    value: 15
enum/Clkmode:
  bit_size: 2
  variants:
  - name: SystemClockMode
    description: System Clock mode.
    value: 0
  - name: SampledSystemClockMode
    description: Sampled System Clock mode.
    value: 1
  - name: SctInputClockMode
    description: SCT Input Clock mode.
    value: 2
  - name: AsynchronousMode
    description: Asynchronous mode.
    value: 3
enum/Combmode:
  bit_size: 2
  variants:
  - name: Or
    description: OR (the event occurs when either the specified match or I/O condition occurs).
    value: 0
  - name: Match
    description: MATCH (uses the specified match only).
    value: 1
  - name: Io
    description: IO (uses the specified I/O condition only).
    value: 2
  - name: And
    description: AND (the event occurs when the specified match and I/O condition occur simultaneously).
    value: 3
enum/Direction:
  bit_size: 2
  variants:
  - name: DirectionIndependent
    description: Direction independent (event triggered regardless of the count direction).
    value: 0
  - name: CountingUp
    description: Counting up (event triggered only during up-counting when CTRL[BIDIR] = 1).
    value: 1
  - name: CountingDown
    description: Counting down (event triggered only during down-counting when CTRL[BIDIR] = 1).
    value: 2
enum/DownH:
  bit_size: 1
  variants:
  - name: Up
    description: Up.
    value: 0
  - name: Down
    description: Down.
    value: 1
enum/DownL:
  bit_size: 1
  variants:
  - name: Up
    description: Up.
    value: 0
  - name: Down
    description: Down.
    value: 1
enum/Hevent:
  bit_size: 1
  variants:
  - name: LCounter
    description: Low counter (selects the L state and the L match register that the MATCHSEL field specifies).
    value: 0
  - name: HCounter
    description: High counter (selects the H state and the H match register that the MATCHSEL field specifies).
    value: 1
enum/Iocond:
  bit_size: 2
  variants:
  - name: Low
    description: Low.
    value: 0
  - name: Rise
    description: Rise.
    value: 1
  - name: Fall
    description: Fall.
    value: 2
  - name: High
    description: High.
    value: 3
enum/NoreloadH:
  bit_size: 1
  variants:
  - name: ReloadH
    description: Reloaded.
    value: 0
  - name: NoReloadH
    description: Not reloaded.
    value: 1
enum/NoreloadL:
  bit_size: 1
  variants:
  - name: Reload
    description: Reloaded.
    value: 0
  - name: NoReload
    description: Not reloaded.
    value: 1
enum/Ores:
  bit_size: 2
  variants:
  - name: NoChange
    description: No change.
    value: 0
  - name: Set
    description: Set output (or clear, based on OUTPUTDIRCTRL[SETCLRn]).
    value: 1
  - name: Clear
    description: Clear output (or set, based on OUTPUTDIRCTRL[SETCLRn]).
    value: 2
  - name: ToggleOutput
    description: Toggle output.
    value: 3
enum/OutVal:
  bit_size: 1
  variants:
  - name: Low
    description: Forces the corresponding output low.
    value: 0
  - name: High
    description: Forces the corresponding output high.
    value: 1
enum/Outsel:
  bit_size: 1
  variants:
  - name: Input
    description: Inputs.
    value: 0
  - name: Output
    description: Outputs.
    value: 1
enum/RegmodH:
  bit_size: 1
  variants:
  - name: Match
    description: Match.
    value: 0
  - name: Capture
    description: Capture.
    value: 1
enum/RegmodL:
  bit_size: 1
  variants:
  - name: Match
    description: Match.
    value: 0
  - name: Capture
    description: Capture.
    value: 1
enum/Setclr:
  bit_size: 2
  variants:
  - name: Independent
    description: Not dependent on the direction of any counter.
    value: 0
  - name: LReversed
    description: Reversed when counter L or the unified counter is counting down.
    value: 1
  - name: HReversed
    description: Reversed when counter H is counting down (do not use this value when CONFIG[UNIFY] = 1).
    value: 2
enum/Stateld:
  bit_size: 1
  variants:
  - name: Add
    description: Value of STATEV added to that of STATE (the carry out is ignored).
    value: 0
  - name: Load
    description: Value of STATEV loaded into that of STATE.
    value: 1
enum/Unify:
  bit_size: 1
  variants:
  - name: DualCounter
    description: Dual counters, COUNTER_L and COUNTER_H.
    value: 0
  - name: UnifiedCounter
    description: Unified counter.
    value: 1
