  bit_size: 1
  variants:
  - name: INIT_TRIM_FINE_MID
    description: Mid-scale.
    value: 0
  - name: INIT_TRIM_FINE_IFR
    description: IFR.
    value: 1
enum/UTMI_CLK_VLD:
