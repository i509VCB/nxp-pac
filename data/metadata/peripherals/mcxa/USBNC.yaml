    value: 3
  - name: LPM_DEV_BESLTHRES4
    description: 350 us, if LPM_ERRATA_EN = 1; 350 us, if LPM_ERRATA_EN = 0.
    value: 4
  - name: LPM_DEV_BESLTHRES5
    description: 450 us, if LPM_ERRATA_EN = 1; 425 us, if LPM_ERRATA_EN = 0.
    value: 5
  - name: LPM_DEV_BESLTHRES6
