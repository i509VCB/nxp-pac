    value: 6
  - name: LPM_DEV_BESLTHRES7
    description: 1950 us, if LPM_ERRATA_EN = 1; 575 us, if LPM_ERRATA_EN = 0.
    value: 7
  - name: LPM_DEV_BESLTHRES8
    description: 2950 us, if LPM_ERRATA_EN = 1; 650 us, if LPM_ERRATA_EN = 0.
