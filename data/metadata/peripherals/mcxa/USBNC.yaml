  - name: LPM_DEV_RWKENRCVD1
    description: '1.'
    value: 1
enum/LPM_EN:
  bit_size: 1
  variants:
  - name: LPM_EN0
    description: Disable.
    value: 0
  - name: LPM_EN1
    description: Enable.
    value: 1
enum/LPM_EN_ENDP_CHK:
  bit_size: 1
  variants:
  - name: LPM_EN_ENDP_CHK_0
    description: Disabled.
    value: 0
  - name: LPM_EN_ENDP_CHK_1
    description: Enabled.
    value: 1
