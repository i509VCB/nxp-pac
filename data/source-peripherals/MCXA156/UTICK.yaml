block/Utick:
  description: UTICK.
  items:
  - name: ctrl
    description: Control.
    byte_offset: 0
    fieldset: Ctrl
  - name: stat
    description: Status.
    byte_offset: 4
    fieldset: Stat
  - name: cfg
    description: Capture Configuration.
    byte_offset: 8
    fieldset: Cfg
  - name: capclr
    description: Capture Clear.
    byte_offset: 12
    access: Write
    fieldset: Capclr
  - name: cap
    description: Capture.
    array:
      len: 4
      stride: 4
    byte_offset: 16
    access: Read
    fieldset: Cap
fieldset/Cap:
  description: Capture.
  fields:
  - name: cap_value
    description: Captured Value for the Related Capture Event.
    bit_offset: 0
    bit_size: 31
  - name: valid
    description: Captured Value Valid Flag.
    bit_offset: 31
    bit_size: 1
fieldset/Capclr:
  description: Capture Clear.
  fields:
  - name: capclr0
    description: Clear Capture 0.
    bit_offset: 0
    bit_size: 1
    enum: Capclr0
  - name: capclr1
    description: Clear Capture 1.
    bit_offset: 1
    bit_size: 1
    enum: Capclr1
  - name: capclr2
    description: Clear Capture 2.
    bit_offset: 2
    bit_size: 1
    enum: Capclr2
  - name: capclr3
    description: Clear Capture 3.
    bit_offset: 3
    bit_size: 1
    enum: Capclr3
fieldset/Cfg:
  description: Capture Configuration.
  fields:
  - name: capen0
    description: Enable Capture 0.
    bit_offset: 0
    bit_size: 1
    enum: Capen0
  - name: capen1
    description: Enable Capture 1.
    bit_offset: 1
    bit_size: 1
    enum: Capen1
  - name: capen2
    description: Enable Capture 2.
    bit_offset: 2
    bit_size: 1
    enum: Capen2
  - name: capen3
    description: Enable Capture 3.
    bit_offset: 3
    bit_size: 1
    enum: Capen3
  - name: cappol0
    description: Capture Polarity 0.
    bit_offset: 8
    bit_size: 1
    enum: Cappol0
  - name: cappol1
    description: Capture-Polarity 1.
    bit_offset: 9
    bit_size: 1
    enum: Cappol1
  - name: cappol2
    description: Capture Polarity 2.
    bit_offset: 10
    bit_size: 1
    enum: Cappol2
  - name: cappol3
    description: Capture Polarity 3.
    bit_offset: 11
    bit_size: 1
    enum: Cappol3
fieldset/Ctrl:
  description: Control.
  fields:
  - name: delayval
    description: Tick Interval.
    bit_offset: 0
    bit_size: 31
  - name: repeat
    description: Repeat Delay.
    bit_offset: 31
    bit_size: 1
    enum: Repeat
fieldset/Stat:
  description: Status.
  fields:
  - name: intr
    description: Interrupt Flag.
    bit_offset: 0
    bit_size: 1
  - name: active
    description: Timer Active Flag.
    bit_offset: 1
    bit_size: 1
    enum: Active
enum/Active:
  bit_size: 1
  variants:
  - name: Timerisnotactive
    description: Inactive (stopped).
    value: 0
  - name: Timerisactive
    description: Active.
    value: 1
enum/Capclr0:
  bit_size: 1
  variants:
  - name: Capclr0nothing
    description: Does nothing.
    value: 0
  - name: Capclr0cleared
    description: Clears the CAP0 register value.
    value: 1
enum/Capclr1:
  bit_size: 1
  variants:
  - name: Capclr1nothing
    description: Does nothing.
    value: 0
  - name: Capclr1cleared
    description: Clears the CAP1 register value.
    value: 1
enum/Capclr2:
  bit_size: 1
  variants:
  - name: Capclr2nothing
    description: Does nothing.
    value: 0
  - name: Capclr2cleared
    description: Clears the CAP2 register value.
    value: 1
enum/Capclr3:
  bit_size: 1
  variants:
  - name: Capclr3nothing
    description: Does nothing.
    value: 0
  - name: Capclr3cleared
    description: Clears the CAP3 register value.
    value: 1
enum/Capen0:
  bit_size: 1
  variants:
  - name: Capen0isdisabled
    description: Disable.
    value: 0
  - name: Capen0isenabled
    description: Enable.
    value: 1
enum/Capen1:
  bit_size: 1
  variants:
  - name: Capen1isdisabled
    description: Disable.
    value: 0
  - name: Capen1isenabled
    description: Enable.
    value: 1
enum/Capen2:
  bit_size: 1
  variants:
  - name: Capen2isdisabled
    description: Disable.
    value: 0
  - name: Capen2isenabled
    description: Enable.
    value: 1
enum/Capen3:
  bit_size: 1
  variants:
  - name: Capen3isdisabled
    description: Disable.
    value: 0
  - name: Capen3isenabled
    description: Enable.
    value: 1
enum/Cappol0:
  bit_size: 1
  variants:
  - name: Cappol0posedgecapture
    description: Positive.
    value: 0
  - name: Cappol0negedgecapture
    description: Negative.
    value: 1
enum/Cappol1:
  bit_size: 1
  variants:
  - name: Cappol1posedgecapture
    description: Positive.
    value: 0
  - name: Cappol1negedgecapture
    description: Negative.
    value: 1
enum/Cappol2:
  bit_size: 1
  variants:
  - name: Cappol2posedgecapture
    description: Positive.
    value: 0
  - name: Cappol2negedgecapture
    description: Negative.
    value: 1
enum/Cappol3:
  bit_size: 1
  variants:
  - name: Cappol3posedgecapture
    description: Positive.
    value: 0
  - name: Cappol3negedgecapture
    description: Negative.
    value: 1
enum/Repeat:
  bit_size: 1
  variants:
  - name: Delayonce
    description: One-time delay.
    value: 0
  - name: Delayrepeats
    description: Delay repeats continuously.
    value: 1
