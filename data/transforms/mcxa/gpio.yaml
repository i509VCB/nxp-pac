transforms:
  # MCXA uses rgpio group name
  - !Rename
    from: rgpio::Rgpio
    to: gpio::Gpio
    type: All

  - !Rename
    from: rgpio::(.*)
    to: gpio::$1
    type: All

  - !MakeRegisterArray
    blocks: gpio::Gpio
    from: isfr(\d+)
    to: isfr

  - !MergeFieldsets
    from: gpio::Isfr\d
    to: gpio::Isfr
